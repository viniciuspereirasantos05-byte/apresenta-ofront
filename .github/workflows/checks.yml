name: Kennedy Labs checks

on:
  push:
    branches:
      - main
      - estrutura-inicial-kennedy-labs
  pull_request:
    branches:
      - main

jobs:
  backend-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verificar sintaxe do backend
        working-directory: backend
        run: npm run check
